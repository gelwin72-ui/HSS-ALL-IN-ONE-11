    <noscript>
      <div style="padding: 24px; font-family: sans-serif; background-color: #0f1115; color: #f8fafc; max-width: 800px; margin: 0 auto;">
        <h1>HSS ALL IN ONE</h1>
        <p><strong>HSS ALL IN ONE</strong> is an educational resource platform for Higher Secondary students, providing study materials, notes, PDFs, question papers and useful academic resources.</p>
        <h2>Key Academic & Classroom Features</h2>
        <ul>
          <li>Higher Secondary study materials, notes, question papers, and academic resources</li>
          <li>Student management, roll lists, and division rosters</li>
          <li>Daily attendance tracking, monthly percentages, and absentee registers</li>
          <li>Exam marks entry, grading systems, rankings, and academic performance analytics</li>
          <li>High-definition PDF report generation compatible with Android WebViews and mobile devices</li>
          <li>Authorized School Admin Portal for institutional oversight, teacher directories, and student master records</li>
        </ul>
        <p>Please enable JavaScript in your browser to access the interactive HSS ALL IN ONE dashboard.</p>
      </div>
    </noscript>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F1115;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px;text-align:center;">
        <div style="width:40px;height:40px;border-radius:9999px;border:3px solid rgba(168,85,247,0.25);border-top-color:#a855f7;animation:hssSpin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:15px;font-weight:700;letter-spacing:0.04em;color:#ffffff;">HSS ALL IN ONE</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:6px;">Initializing workspace...</div>
      </div>
    </div>
    <script>
      (function () {
        var bootError = null;
        function isMounted() {
          var root = document.getElementById('root');
          return root && root.getAttribute('data-mounted') === 'true';
        }
        async function clearSwAndReload() {
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if ('caches' in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (e) {}
          var url = window.location.pathname + window.location.search;
          var sep = url.indexOf('?') === -1 ? '?' : '&';
          window.location.replace(url + sep + '_r=' + Date.now() + window.location.hash);
        }
        function showRecovery(reason) {
          if (isMounted()) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '';
          var wrap = document.createElement('div');
          wrap.setAttribute('style', 'min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0F1115;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;box-sizing:border-box;');
          var card = document.createElement('div');
          card.setAttribute('style', 'max-width:420px;width:100%;background:#1A1C23;border:1px solid rgba(168,85,247,0.35);border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.5);');
          var title = document.createElement('h1');
          title.textContent = 'HSS ALL IN ONE';
          title.setAttribute('style', 'margin:0 0 8px 0;font-size:18px;font-weight:800;color:#fff;');
          var isRawSourceOnGhPages = Boolean(
            reason &&
            String(reason).indexOf('src/main.tsx') !== -1 &&
            window.location.hostname.indexOf('github.io') !== -1
          );
          var desc = document.createElement('p');
          desc.textContent = isRawSourceOnGhPages
            ? 'GitHub Pages is currently serving unbuilt source files (src/main.tsx) instead of the compiled app. In your GitHub repo go to Settings -> Pages -> Source and select "GitHub Actions", then run the Deploy to GitHub Pages workflow.'
            : 'A cached asset or slow connection delayed startup. Tap below to clear stale cache and load the latest version.';
          desc.setAttribute('style', 'margin:0 0 14px 0;font-size:13px;line-height:1.5;color:#cbd5e1;');
          card.appendChild(title);
          card.appendChild(desc);
          if (reason) {
            var code = document.createElement('div');
            code.textContent = String(reason).slice(0, 200);
            code.setAttribute('style', 'margin:0 0 16px 0;padding:10px;border-radius:10px;background:#0F1115;border:1px solid #2D3139;font-family:monospace;font-size:11px;color:#fda4af;word-break:break-word;text-align:left;');
            card.appendChild(code);
          }
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Clear Cache & Reload';
          btn.setAttribute('style', 'width:100%;padding:12px 16px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-size:13px;font-weight:700;cursor:pointer;');
          btn.onclick = clearSwAndReload;
          card.appendChild(btn);
          wrap.appendChild(card);
          root.appendChild(wrap);
        }
        window.addEventListener('error', function (ev) {
          if (isMounted()) return;
          var target = ev && ev.target;
          var isAssetErr = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          var msg = isAssetErr ? ('Asset failed to load: ' + (target.src || target.href || 'resource')) : (ev && ev.message);
          if (msg) bootError = msg;
          if (isAssetErr) {
            try {
              if (!sessionStorage.getItem('hss_sw_recovery_v1')) {
                sessionStorage.setItem('hss_sw_recovery_v1', '1');
                clearSwAndReload();
                return;
              }
            } catch (e) {}
            showRecovery(bootError);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          if (isMounted()) return;
          var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : 'Startup promise rejected';
          bootError = reason;
          showRecovery(bootError);
        });
        setTimeout(function () {
          if (!isMounted()) {
            showRecovery(bootError || 'Application scripts took too long to respond.');
          }
        }, 9000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
